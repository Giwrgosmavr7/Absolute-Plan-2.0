<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Plan | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen max-w-5xl mx-auto">

    <!-- Header -->
    <header class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                <i class="fa-solid fa-bolt mr-2 text-blue-400"></i>Absolute Plan
            </h1>
            <p class="text-slate-400 mt-2 text-sm">Δυναμικός Προγραμματισμός & Σημειώσεις</p>
        </div>
        <button onclick="toggleModal('addCourseModal')" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold transition shadow-lg shadow-blue-500/30 text-sm">
            <i class="fa-solid fa-plus mr-1"></i> Νέο Μάθημα
        </button>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-700 mb-6 overflow-x-auto">
        <button onclick="switchTab('todayPlan')" id="tab-todayPlan" class="px-4 py-3 font-medium text-sm tab-active whitespace-nowrap"><i class="fa-solid fa-calendar-day mr-2"></i>Τι κάνω Σήμερα</button>
        <button onclick="switchTab('fullTimeline')" id="tab-fullTimeline" class="px-4 py-3 font-medium text-sm text-slate-400 hover:text-slate-200 whitespace-nowrap"><i class="fa-solid fa-route mr-2"></i>Πλάνο έως Εξετάσεις</button>
        <button onclick="switchTab('courseDetails')" id="tab-courseDetails" class="px-4 py-3 font-medium text-sm text-slate-400 hover:text-slate-200 whitespace-nowrap"><i class="fa-solid fa-book-open mr-2"></i>Μαθήματα & Σημειώσεις</button>
    </div>

    <!-- Tab 1: Τι κάνω Σήμερα (Με Logging) -->
    <div id="view-todayPlan" class="block">
        <div id="todayContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </div>

    <!-- Tab 2: Πλάνο έως τις Εξετάσεις -->
    <div id="view-fullTimeline" class="hidden">
        <div class="glass-card p-6 rounded-2xl">
            <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-timeline mr-2 text-blue-400"></i>Ημερήσια Πρόβλεψη Μελέτης</h2>
            <p class="text-sm text-slate-400 mb-6">Το πλάνο αναπροσαρμόζεται αυτόματα ανάλογα με το τι καταγράφεις κάθε μέρα.</p>
            <div id="timelineContainer" class="space-y-4"></div>
        </div>
    </div>

    <!-- Tab 3: Μαθήματα & Σημειώσεις -->
    <div id="view-courseDetails" class="hidden">
        <div id="coursesContainer" class="grid grid-cols-1 gap-6"></div>
    </div>

    <!-- Modal Προσθήκης -->
    <div id="addCourseModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="glass-card p-6 rounded-2xl w-full max-w-md border border-slate-600">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Προσθήκη Μαθήματος</h2>
                <button onclick="toggleModal('addCourseModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="addCourse(event)" class="space-y-4">
                <input type="text" id="cName" placeholder="Όνομα Μαθήματος" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <input type="date" id="cDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <input type="number" id="cHours" placeholder="Απαιτούμενες Ώρες (Συνολικά)" required min="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg mt-4 transition">Αποθήκευση</button>
            </form>
        </div>
    </div>

    <script>
        // Δομή Δεδομένων
        let courses = JSON.parse(localStorage.getItem('absolute_plan_v3')) || [];

        function saveCourses() {
            localStorage.setItem('absolute_plan_v3', JSON.stringify(courses));
            refreshAllViews();
        }

        function switchTab(tabId) {
            ['todayPlan', 'fullTimeline', 'courseDetails'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('tab-' + id).classList.remove('tab-active', 'text-blue-500');
                document.getElementById('tab-' + id).classList.add('text-slate-400');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.add('tab-active');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function getDaysLeft(examDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const exam = new Date(examDateStr);
            return Math.max(0, Math.ceil((exam.getTime() - today.getTime()) / (1000 * 3600 * 24)));
        }

        function addCourse(e) {
            e.preventDefault();
            courses.push({
                id: Date.now(),
                name: document.getElementById('cName').value,
                examDate: document.getElementById('cDate').value,
                targetHours: parseFloat(document.getElementById('cHours').value),
                hoursCompleted: 0,
                readiness: 0,
                notes: ""
            });
            saveCourses();
            e.target.reset();
            toggleModal('addCourseModal');
        }

        function updateField(id, field, value) {
            const course = courses.find(c => c.id === id);
            if(field === 'hoursCompleted') course.hoursCompleted += parseFloat(value);
            else course[field] = value;
            saveCourses();
        }

        // --- TAB 1: Τι κάνω σήμερα (Προσαρμογή & Καταγραφή) ---
        function renderTodayPlan() {
            const container = document.getElementById('todayContainer');
            container.innerHTML = '';
            
            if (courses.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">Πρόσθεσε μαθήματα για να ξεκινήσεις.</div>`; return;
            }

            courses.forEach(course => {
                const daysLeft = getDaysLeft(course.examDate);
                const remainingHours = Math.max(0, course.targetHours - course.hoursCompleted);
                const dailyGoal = daysLeft > 0 ? (remainingHours / daysLeft).toFixed(1) : remainingHours.toFixed(1);

                if (remainingHours > 0) {
                    container.innerHTML += `
                        <div class="glass-card p-5 rounded-2xl border-l-4 ${daysLeft < 4 ? 'border-red-500' : 'border-blue-500'} flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold">${course.name}</h3>
                                    <span class="bg-slate-800 text-xs px-2 py-1 rounded text-slate-300">Σε ${daysLeft} μέρες</span>
                                </div>
                                <div class="flex items-end gap-2 mb-6">
                                    <span class="text-4xl font-black text-white">${dailyGoal}</span>
                                    <span class="text-slate-400 mb-1">ώρες στόχος για σήμερα</span>
                                </div>
                            </div>
                            
                            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                                <label class="text-xs text-slate-400 block mb-2 uppercase">Καταγραφή Πραγματικών Ωρών</label>
                                <div class="flex gap-2">
                                    <input type="number" id="log-${course.id}" step="0.5" min="0.5" placeholder="π.χ. 2.5" class="w-24 bg-slate-900 border border-slate-600 rounded-lg p-2 text-white">
                                    <button onclick="logHours(${course.id})" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition">Καταγραφή</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function logHours(id) {
            const input = document.getElementById(`log-${id}`);
            const val = parseFloat(input.value);
            if(val > 0) {
                updateField(id, 'hoursCompleted', val);
            }
        }

        // --- TAB 2: Full Timeline ---
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';
            
            let html = "";
            let currentDate = new Date();
            currentDate.setHours(0,0,0,0);
            
            // Βρίσκουμε την τελευταία εξέταση
            const examDates = courses.map(c => new Date(c.examDate).getTime());
            if(examDates.length === 0) return;
            const lastExamDate = new Date(Math.max(...examDates));

            // Γεννάμε τις μέρες
            while(currentDate <= lastExamDate) {
                let daySchedule = "";
                let hasExamsToday = false;

                courses.forEach(c => {
                    const examD = new Date(c.examDate);
                    const daysUntilExam = Math.max(0, Math.ceil((examD - currentDate) / (1000 * 3600 * 24)));
                    
                    if (daysUntilExam === 0) {
                        hasExamsToday = true;
                        daySchedule += `<div class="text-red-400 font-bold text-sm bg-red-500/10 p-2 rounded mt-1">ΕΞΕΤΑΣΗ: ${c.name}</div>`;
                    } else if (daysUntilExam > 0) {
                        // Υπολογισμός projection (πόσες ώρες θα χρειάζονται ανά μέρα)
                        const remainingH = Math.max(0, c.targetHours - c.hoursCompleted);
                        const daysL = getDaysLeft(c.examDate);
                        const daily = daysL > 0 ? (remainingH / daysL).toFixed(1) : 0;
                        
                        if(daily > 0) {
                            daySchedule += `<div class="text-sm text-slate-300 mt-1 flex justify-between border-b border-slate-700/50 pb-1">
                                <span>${c.name}</span> <span class="font-bold text-blue-400">${daily}h</span>
                            </div>`;
                        }
                    }
                });

                if (daySchedule !== "") {
                    const isToday = currentDate.getTime() === new Date().setHours(0,0,0,0);
                    html += `
                        <div class="flex flex-col md:flex-row gap-4 p-4 ${isToday ? 'bg-blue-900/20 border border-blue-500/30' : 'bg-slate-800/40'} rounded-xl">
                            <div class="w-32 flex-shrink-0 text-slate-400 font-medium ${isToday ? 'text-blue-400' : ''}">
                                ${currentDate.toLocaleDateString('el-GR', { weekday: 'short', day: 'numeric', month: 'short' })}
                                ${isToday ? '<span class="text-xs block">ΣΗΜΕΡΑ</span>' : ''}
                            </div>
                            <div class="flex-grow">${daySchedule}</div>
                        </div>
                    `;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            container.innerHTML = html;
        }

        // --- TAB 3: Μαθήματα & Σημειώσεις ---
        function renderCourses() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';
            
            courses.forEach(course => {
                const perc = course.targetHours > 0 ? Math.min(100, Math.round((course.hoursCompleted / course.targetHours) * 100)) : 0;
                
                container.innerHTML += `
                    <div class="glass-card p-6 rounded-2xl relative">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-2xl font-bold">${course.name}</h3>
                            <button onclick="deleteCourse(${course.id})" class="text-slate-500 hover:text-red-500 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="mb-6">
                            <div class="flex justify-between text-sm mb-1 text-slate-300">
                                <span>Πρόοδος: ${course.hoursCompleted} / ${course.targetHours} Ώρες</span>
                                <span>${perc}%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-3">
                                <div class="bg-emerald-500 h-3 rounded-full" style="width: ${perc}%"></div>
                            </div>
                        </div>

                        <!-- Σημειώσεις -->
                        <div>
                            <label class="text-sm text-slate-400 block mb-2"><i class="fa-solid fa-pen mr-1"></i>Προσωπικές Σημειώσεις (SOS, Απορίες κλπ)</label>
                            <textarea onchange="updateField(${course.id}, 'notes', this.value)" class="w-full h-24 bg-slate-800/50 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 outline-none resize-none placeholder-slate-600" placeholder="Γράψε εδώ τις σημειώσεις σου...">${course.notes}</textarea>
                        </div>
                    </div>
                `;
            });
        }

        function deleteCourse(id) {
            if(confirm("Διαγραφή μαθήματος;")) { courses = courses.filter(c => c.id !== id); saveCourses(); }
        }

        function refreshAllViews() {
            renderTodayPlan();
            renderTimeline();
            renderCourses();
        }

        refreshAllViews();
    </script>
</body>
</html>
